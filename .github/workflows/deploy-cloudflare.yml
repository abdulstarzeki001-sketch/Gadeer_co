name: Deploy to Cloudflare Worker

on:
  push:
    branches:
      - main
      - codex/-cloudflare-41pgv4
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  SUPABASE_URL: "https://xwigjsrbalbjwwjkxyma.supabase.co"
  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_RlV4mTHoLYnGwtPrvrJgJg_9GDmQnKl"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}

      # This branch is the active production source for the Ghadeer redesign.
      - name: Deploy to Cloudflare Worker
        run: npx wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
